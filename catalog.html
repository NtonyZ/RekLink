<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Каталог рекламных мест — ФОРУС</title>
<meta name="description" content="Каталог скроллеров, медиа-скроллеров, LED-экранов и видеопанелей с картой и фильтрами по городу, формату и периоду.">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
.cat-toolbar { background:var(--bg-soft); border-bottom:1px solid var(--line); padding:18px 0; position:sticky; top:72px; z-index:50; }
.cat-toolbar .row1 { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
.cat-toolbar .row2 { display:flex; gap:14px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
.cat-toolbar select, .cat-toolbar input[type=number] { padding:9px 12px; border:1.5px solid var(--line); border-radius:99px; background:#fff; font-size:13px; }
.view-toggle { display:flex; background:#fff; border:1.5px solid var(--line); border-radius:99px; padding:3px; }
.view-toggle button { border:none; background:transparent; padding:7px 16px; border-radius:99px; font-size:13px; font-weight:600; cursor:pointer; color:var(--muted); }
.view-toggle button.active { background:var(--grad); color:#fff; }
.cat-body { display:grid; grid-template-columns:460px 1fr; gap:0; align-items:stretch; }
.cat-list { max-height:calc(100vh - 200px); overflow-y:auto; padding:20px; border-right:1px solid var(--line); }
.cat-map-wrap { position:sticky; top:170px; height:calc(100vh - 200px); }
#cat-map { width:100%; height:100%; }
.cat-item { display:flex; gap:14px; padding:14px; border-radius:var(--radius-sm); border:1px solid var(--line); margin-bottom:12px; cursor:pointer; transition:border-color .15s, box-shadow .15s; }
.cat-item:hover { border-color:var(--violet); box-shadow:var(--shadow-sm); }
.cat-item .thumb { width:88px; height:72px; flex-shrink:0; border-radius:10px; }
.cat-item .info { flex:1; min-width:0; }
.cat-item .info h4 { font-size:14px; margin:0 0 4px; }
.cat-item .info .meta { font-size:12px; color:var(--muted); margin-bottom:6px; }
.cat-item .info .price-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.cat-item .info .price-row b { font-size:14px; }
.cat-count { font-size:13px; color:var(--muted); }
.leaflet-popup-content { font-family:var(--font); min-width:220px; }
.pop-photo { height:90px; border-radius:8px; margin-bottom:8px; }
.pop-title { font-weight:700; font-size:13.5px; margin-bottom:4px; }
.pop-meta { font-size:12px; color:var(--muted); margin-bottom:8px; }
.pop-actions { display:flex; gap:6px; margin-top:8px; }
.pop-actions a, .pop-actions button { flex:1; text-align:center; padding:7px 6px; border-radius:8px; font-size:12px; font-weight:600; border:none; cursor:pointer; }
.rl-marker { border-radius:50%; border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.35); }
.empty-state { text-align:center; padding:60px 20px; color:var(--muted); }
@media (max-width: 980px) {
  .cat-body { grid-template-columns:1fr; }
  .cat-list, .cat-map-wrap { max-height:none; height:auto; position:static; }
  .cat-map-wrap { height:420px; }
  body[data-view="list"] .cat-map-wrap { display:none; }
  body[data-view="map"] .cat-list { display:none; }
}
</style>
</head>
<body data-view="split">
<a href="#main" class="skip-link">Перейти к содержимому</a>
<header id="site-header" class="site-header"></header>
<div id="site-steps" class="site-steps" data-step="1"></div>
<div class="cat-toolbar">
  <div class="container">
    <div class="row1" id="format-chips"></div>
    <div class="row2">
      <div class="flex gap-8" style="flex-wrap:wrap">
        <select id="f-city"><option value="">Любой город</option></select>
        <select id="f-month"></select>
        <select id="f-dtype">
          <option value="">Любой показ</option>
          <option value="static">Статичный</option>
          <option value="rotating">Прокрутка</option>
        </select>
        <input type="number" id="f-price-max" placeholder="Бюджет, до BYN/мес" min="0" step="10" style="width:150px">
        <label class="chip" style="cursor:pointer">
          <input type="checkbox" id="f-free" style="margin-right:6px">Только свободные
        </label>
        <select id="f-sort">
          <option value="price-asc">Цена: по возрастанию</option>
          <option value="price-desc">Цена: по убыванию</option>
          <option value="reach-desc">Охват: сначала больше</option>
          <option value="cpm-asc">CPM: сначала дешевле</option>
          <option value="alpha">По алфавиту адреса</option>
        </select>
      </div>
      <div class="view-toggle">
        <button data-view="list">Список</button>
        <button data-view="split">Список + карта</button>
        <button data-view="map">Карта</button>
      </div>
    </div>
  </div>
</div>

<main id="main">
  <div class="cat-body">
    <div class="cat-list">
      <div class="flex-between mb-24">
        <span class="cat-count" id="cat-count"></span>
      </div>
      <div id="cat-items"></div>
    </div>
    <div class="cat-map-wrap">
      <div id="cat-map"></div>
    </div>
  </div>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="assets/js/data.js"></script>
<script src="assets/js/occupancy.js"></script>
<script src="assets/js/locations.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/layout.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="assets/js/catalog.js"></script>
</body>
</html>
